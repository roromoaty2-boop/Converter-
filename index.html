<head>

    <link rel="stylesheet" href="./css/index.css">
    <title>Converter</title>
</head>
<body>
    
    <div class="converter">


        <h1>Inch-To-Meter Converter</h1>


        <div class="process">

            <p>Number of inches:</p>

            <div class="inputs">


                <input type="text" class="number" name="" id="" placeholder="Enter number of inches here">


                <div class="input-btn">


                    <button>Clculate</button>


                    <div class="result-btn">


                        <p>The result will appear here</p>


                    </div>

                </div>

            </div>

        </div>

    </div>


    <script src="./js/index.js"></script>
</body>
